apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: smartvenue-frontend
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "60"
    spec:
      containers:
        - image: frontend
          ports:
            - containerPort: 8080
          env:
            - name: BACKEND_URL
              value: https://smartvenue-backend-REPLACE_WITH_HASH-uc.a.run.app

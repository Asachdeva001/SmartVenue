apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: smartvenue-backend
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "100"
    spec:
      containers:
        - image: backend
          ports:
            - containerPort: 8080
          env:
            - name: GCP_PROJECT_ID
              value: PROJECT_ID
            - name: INGEST_TOPIC
              value: smartvenue-prod-events-raw
